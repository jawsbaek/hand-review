name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  replay-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: npm install --no-save --no-package-lock playwright@1.58.1
      - run: npx playwright install --with-deps chromium
      - run: cargo build --release --locked --manifest-path ev_rust/Cargo.toml
      - run: uv run pytest tests/test_coaching.py tests/test_workbench.py
      - run: uv run hand-review replay samples/pokerist/demo.jsonl -o reports/demo.html --analysis-samples 32
      - run: node scripts/verify_replay.mjs
      - run: HAND_REVIEW_PYTHON=$(uv run python -c 'import sys; print(sys.executable)') node scripts/verify_coaching.mjs
