[package]
name = "ev_rust"
version = "0.1.0"
edition = "2021"
publish = false
# postflop-solver가 AGPL-3.0-or-later라 이 바이너리도 AGPL 파생물이 됨
license = "AGPL-3.0-or-later"

[dependencies]
# 2023-10-01 개발 중단 시점의 최종 커밋에 고정
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
# ↑ bincode 기능 끔: crate가 "2.0.0-rc.3"을 caret으로 요구해 2.0.1이 잡히며 컴파일 깨짐 (트리 저장/로드 불필요)
serde_json = "=1.0.128"

[profile.release]
lto = true
codegen-units = 1
