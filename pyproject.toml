[project]
name = "poker-play-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pokerkit==0.7.6",
    "textual==8.2.8",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
