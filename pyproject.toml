[project]
name = "hand-review"
version = "0.2.0"
description = "Poker hand history analyzer: VPIP/PFR/3-bet, bb/100, all-in EV, ICM, MTT ROI, with a terminal UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jawsbaek", email = "bshjaws1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pokerkit==0.7.6",
    "textual==8.2.8",
]

[project.scripts]
hand-review = "hand_review.analyze:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning:pokerkit.*"]

[project.urls]
Repository = "https://github.com/jawsbaek/hand-review"
